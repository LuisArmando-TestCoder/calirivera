# Netlify — base directory = web (repo root = cali-rivera/, so ../content is available at build).
# El runtime de Next.js va fijado abajo: sin él Netlify sube solo archivos estáticos (0 funciones) y no
# funcionan el editor, /api, el proxy ni el contenido que se transmite en vivo.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"
  # Netlify, con base = web, solo reconstruye si cambió algo DENTRO de web/. Pero lo que publica Cali desde el
  # editor se guarda en ../content: sin esta regla esos cambios no disparaban el despliegue.
  # (exit 0 = no construir; exit 1 = construir)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../content"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Secrets go in Netlify UI → Site settings → Environment variables (never in this file):
#   FIREBASE_SERVICE_ACCOUNT (JSON o base64), ADMIN_EMAIL, NEXT_PUBLIC_FIREBASE_*, NEXT_PUBLIC_SITE_URL

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
