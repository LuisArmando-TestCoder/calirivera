# Netlify — base directory = web (repo root = cali-rivera/, so ../content is available at build).
# Next.js runtime is auto-detected (OpenNext adapter); no plugin pin needed.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Secrets go in Netlify UI → Site settings → Environment variables (never in this file):
#   FIREBASE_SERVICE_ACCOUNT (JSON o base64), ADMIN_EMAIL, NEXT_PUBLIC_FIREBASE_*, NEXT_PUBLIC_SITE_URL

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
